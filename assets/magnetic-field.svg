<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icon for extensions.gnome.org: a screen tiled into three windows
       (one on the left, two stacked on the right) and a horseshoe magnet. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ed333b"/>
      <stop offset="1" stop-color="#c01c28"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>

  <!-- screen -->
  <rect x="6" y="14" width="116" height="92" rx="12" fill="#1a5fb4"/>
  <rect x="6" y="12" width="116" height="90" rx="12" fill="url(#screen)"/>

  <!-- tiled windows -->
  <g fill="#ffffff">
    <rect x="13" y="19" width="49" height="76" rx="5"/>
    <rect x="66" y="19" width="49" height="36" rx="5"/>
    <rect x="66" y="59" width="49" height="36" rx="5"/>
  </g>
  <g fill="#deddda">
    <path d="M18 19h39a5 5 0 0 1 5 5v4H13v-4a5 5 0 0 1 5-5z"/>
    <path d="M71 19h39a5 5 0 0 1 5 5v4H66v-4a5 5 0 0 1 5-5z"/>
    <path d="M71 59h39a5 5 0 0 1 5 5v4H66v-4a5 5 0 0 1 5-5z"/>
  </g>

  <!-- horseshoe magnet, the same shape as the top bar icon -->
  <g transform="translate(70 60) scale(3.6)">
    <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round">
      <rect x="2" y="1" width="4" height="3"/>
      <rect x="10" y="1" width="4" height="3"/>
      <path d="M2 5h4v4a2 2 0 0 0 4 0V5h4v4A6 6 0 0 1 2 9z"/>
    </g>
    <rect x="2" y="1" width="4" height="3" fill="url(#tip)"/>
    <rect x="10" y="1" width="4" height="3" fill="url(#tip)"/>
    <path d="M2 5h4v4a2 2 0 0 0 4 0V5h4v4A6 6 0 0 1 2 9z" fill="url(#body)"/>
    <path d="M2 4h4v1H2zM10 4h4v1h-4z" fill="#a51d2d"/>
  </g>
</svg>
